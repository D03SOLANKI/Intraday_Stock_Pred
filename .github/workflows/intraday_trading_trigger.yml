name: Autonomous Intraday Trading Trigger

on:
  schedule:
    # 04:00 UTC corresponds to 09:30 AM IST (Monday to Friday)
    - cron: '0 4 * * 1-5'
  workflow_dispatch:
    inputs:
      active_equity:
        description: 'Active Portfolio Equity (INR)'
        required: false
        default: '10000000.0'

permissions:
  contents: write

jobs:
  execute-scanner:
    name: 09:30 AM Point-in-Time Scan & Order Dispatch
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute 09:30 AM Point-in-Time Scanner
        run: |
          EQUITY="${{ github.event.inputs.active_equity }}"
          if [ -z "$EQUITY" ]; then
            EQUITY="10000000.0"
          fi
          echo "Executing scanner with equity: Rs. $EQUITY"
          python live_scanner.py --equity $EQUITY

      - name: Publish Actionable Orders to Job Summary
        run: |
          echo "## 🚀 09:30 AM Point-in-Time Trading Orders Generated" >> $GITHUB_STEP_SUMMARY
          echo "**Execution Time:** $(date -u) (UTC)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f "daily_live_scan_orders.csv" ]; then
            echo "### 📊 Actionable Order Ledger (Tier 4 Dynamic Compounding)" >> $GITHUB_STEP_SUMMARY
            python -c "
          import pandas as pd
          try:
              df = pd.read_csv('daily_live_scan_orders.csv')
              print(df.to_markdown(index=False))
          except Exception as e:
              print('Error formatting markdown:', e)
          " >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ No orders file generated." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Commit and Push Updated Orders to Cloud
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add daily_live_scan_orders.csv logs/ || true
          if git diff --staged --quiet; then
            echo "No new order changes to commit."
          else
            git commit -m "Automated Daily 09:30 AM Orders Update [skip ci]"
            git push origin main
          fi
